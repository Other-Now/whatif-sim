name: fetch-fred

# Refresh the data snapshot. Uses the FRED API if the FRED_API_KEY secret is
# set, otherwise the BLS API (same series ids). fred.stlouisfed.org's keyless
# CSV endpoint timed out from both the dev machine and GitHub's runners.
# The manifest records source URL, fetch time and SHA-256 of each file.
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m whatif fred-fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: fred-snapshot
          path: data/fred/
