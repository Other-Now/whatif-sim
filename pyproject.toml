[project]
name = "whatif-sim"
version = "0.1.0"
description = "Plain-language what-if questions -> validated stock-and-flow models -> Monte Carlo with provenance"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "scipy>=1.12"]

[tool.setuptools]
packages = ["whatif", "whatif.llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
